spec_version: axit.project/v1

project:
  id: puzzle-solo-example
  name: Puzzle Solo Example
  summary: Example of a small single-player puzzle game using the same reusable Core without multiplayer or mission assumptions.
  stage: prototype

product:
  genres: [puzzle]
  core_loop: "enter room -> inspect state -> manipulate puzzle -> solve -> unlock next space"
  player_count:
    min: 1
    max: 1
  session_model: single-player
  target_platforms: [pc]

engine:
  name: unity
  version: "<pin-per-project>"
  language: csharp

features:
  multiplayer:
    enabled: false
    topology: none
    authority: none
    transport: none
    reconnect: false
    late_join: false

  missions_quests:
    enabled: false
    complexity: none
    branching: false
    scope: []
    persistent_progress: false

  puzzle:
    enabled: true
    systemic: true
    reset_required: true
    hints: true

  procedural_generation:
    enabled: false
    deterministic: false
    seed_authority: none

  persistence:
    enabled: true
    scope: local
    authority: local
    migration_required: false

  economy_progression:
    enabled: false

  combat:
    enabled: false

  inventory:
    enabled: false

packs:
  selected:
    - engine-unity
    - puzzle
    - persistence
    - ui-ux
  proposed: []

runtime:
  preferred_ai_providers: []
  editor_bridge: optional
  axit_code: optional

project_rules:
  source: .agents/rules/project-rules.md

architecture_registry:
  source: .agents/registry/architecture.yaml

validation:
  static_checks:
    - source-format/static checks
  automated_tests:
    - puzzle-state transition tests
    - reset-state tests
  editor_checks:
    - zero compile errors
    - puzzle scene validator
  playtest_matrix:
    - fresh puzzle
    - solve path
    - reset path
    - save/reload mid-puzzle

customization:
  custom_profiles:
    - puzzle-designer
  custom_skills:
    - validate-puzzle-solvability
    - verify-puzzle-reset
    - author-contextual-hints
  custom_workflows: []

notes:
  status: illustrative-only
