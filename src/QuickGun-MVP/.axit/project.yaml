spec_version: axit.project/v1

project:
  id: quickgun-mvp
  name: QuickGun-MVP
  summary: "Unity gameplay prototype used as the first live Axit Project Layer validation target."
  stage: prototype

product:
  core_loop: "Shoot Player/Bot entities through a shared hit-zone-aware damage pipeline."
  player_count:
    min: null
    max: null
  target_platforms: []

engine:
  name: Unity
  version: ""
  language: C#

axit:
  core: ../../.axit/core/core.yaml
  project_rules: .axit/project/rules.md
  architecture_registry: .axit/registry/architecture.yaml
  active_state: .axit/state/active.md

project_layer:
  root: .axit/project
  profiles: []
  skills: []
  workflows: []
  knowledge: []

validation:
  static_checks:
    - git diff --check
  automated_tests:
    - "standalone deterministic C# tests under ../../tests/QuickGun-MVP/"
  editor_checks:
    - "Unity compile/build when the local Unity environment is complete"
  playtest_checks: []

notes:
  - "This embedded project reuses the reviewed repository Core instead of duplicating `.axit/core/` inside QuickGun-MVP."
  - "Unity version, player-count range, and target platforms remain intentionally unconfirmed until read from the local Unity project."
  - "Leave project-layer extension lists empty until repeated local use demonstrates a gap not covered by Core."
