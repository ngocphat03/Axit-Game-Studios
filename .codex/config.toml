# Project-scoped Codex defaults for Axit orchestration.
# Loaded only when this repository is trusted by Codex.

model = "gpt-5.6-sol"
model_reasoning_effort = "max"
# Plan mode currently uses the strongest documented config enum; execution remains max.
plan_mode_reasoning_effort = "xhigh"

# Keep normal command approvals, but let Codex auto-review routine requests
# inside the bounded execution envelope below.
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true

[auto_review]
policy = """
Approve routine actions needed to execute the accepted Axit roadmap when they stay inside the trusted repository/workspace or user-local development environment: repository reads/writes, local builds/tests, deterministic validation, use of an already user-configured and reachable Unity MCP transport, bounded non-destructive Unity evidence acquisition, and bounded repair work inside the accepted scope.

Do not approve installing, configuring, upgrading, starting, or repairing Unity MCP/CoplayDev transport setup; changing global/user Codex MCP configuration; changing Unity package configuration solely to install MCP; sudo/admin escalation; credential/secret access; production or external-cloud writes; git push/publish/PR creation; destructive deletion/migration outside the accepted bounded task; broad unrelated refactors; changing public contracts/state ownership/architecture without an accepted decision; or overwriting unrelated dirty-worktree changes. Return those to the parent orchestrator as a hard-stop condition.
"""

[agents]
enabled = true
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "max"
interrupt_message = true

# Unity MCP is intentionally NOT configured here.
# The user configures and starts MCP for Unity manually before running the continuous Axit plan.
# At runtime, Axit may inspect and use the already-available transport but must not alter its setup.
