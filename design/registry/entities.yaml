# ─── FORMULAS ────────────────────────────────────────────────────────────────
formulas:
  - name: final_damage_formula
    status: active
    source: design/gdd/combat-system.md
    referenced_by:
      - design/gdd/combat-system.md
    variables:
      - base_weapon_damage
      - tier_multiplier
      - motion_value
      - flat_bonus
      - damage_reduction
      - crit_multiplier
      - groggy_multiplier
    output_range: [1, 99999]
    expression: "max(1, (base_weapon_damage * tier_multiplier * motion_value + flat_bonus) * (1 - damage_reduction) * crit_multiplier * groggy_multiplier)"
    notes: "Owned by GDD-COMBAT-001. Calculates actual damage applied to 3D enemy hurtbox."
    added: 2026-08-18
    revised: "2026-08-19"

  - name: poise_damage_formula
    status: active
    source: design/gdd/combat-system.md
    referenced_by:
      - design/gdd/combat-system.md
    variables:
      - base_poise_damage
      - poise_motion_value
      - poise_bonus_rate
    output_range: [0, 999]
    expression: "base_poise_damage * poise_motion_value * (1 + poise_bonus_rate)"
    notes: "Owned by GDD-COMBAT-001. Reduces enemy Poise gauge until Groggy state triggers."
    added: 2026-08-18
    revised: ""

