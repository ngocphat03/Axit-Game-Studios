spec_version: axit.core/v1
status: core-workflow-v1-validation

profiles:
  - technical-architect
  - game-designer
  - implementation-engineer
  - quality-verifier

skills:
  - implement-change
  - verify-change

workflows:
  - bounded-change

rules:
  - Core must remain reusable across materially different game projects.
  - Do not import legacy agents or skills by default.
  - Review each Profile, Skill, and Workflow before adding it to Core.
  - Prefer a project/domain extension over Core when reuse is not proven.
  - Specialize through Skills and Knowledge before creating additional Profiles.
  - Treat the four current Profiles as the default Core responsibility set until a demonstrated gap requires another.
  - Add Core Skills only when a repeated procedure is demonstrated across real flows.
  - Implementation readiness and independent verification remain separate responsibilities.
  - Workflows compose accepted Skills and transitions; they must not duplicate Skill procedures or silently expand scope.

next_phase:
  - test bounded-change through Codex on one bounded feature or fix requested as end-to-end implementation plus verification
  - confirm the Workflow completes only on the latest verify-change PASS
  - confirm verify-change FAIL loops only for a local implementation repair inside accepted scope
  - confirm verify-change BLOCKED stops without speculative code changes
  - confirm design or architecture ambiguity exits to the owning Profile before implementation
  - keep bounded-change in validation until these transitions are observed in live Codex use
  - do not add Core Skill number 3 or another Workflow until a repeated procedural gap is demonstrated
  - do not migrate legacy catalogs in bulk
