spec_version: axit.core/v1
status: core-skill-v2-validation

profiles:
  - technical-architect
  - game-designer
  - implementation-engineer
  - quality-verifier

skills:
  - implement-change
  - verify-change

workflows: []

rules:
  - Core must remain reusable across materially different game projects.
  - Do not import legacy agents or skills by default.
  - Review each Profile and Skill before adding it to Core.
  - Prefer a project/domain extension over Core when reuse is not proven.
  - Specialize through Skills and Knowledge before creating additional Profiles.
  - Treat the four current Profiles as the default Core responsibility set until a demonstrated gap requires another.
  - Add Core Skills only when a repeated procedure is demonstrated across real flows.
  - Implementation readiness and independent verification remain separate responsibilities.

next_phase:
  - test implement-change through Codex on one bounded bug fix and one bounded feature change
  - confirm implement-change preserves unrelated working-tree changes and does not expand scope silently
  - confirm ambiguous product intent hands off before editing
  - confirm material architecture changes hand off before editing
  - run verify-change after implementation and confirm the implementer does not issue the final verdict
  - keep Core Workflows empty until the two accepted Skills demonstrate a stable composition worth encoding
  - do not migrate legacy skill catalogs in bulk
