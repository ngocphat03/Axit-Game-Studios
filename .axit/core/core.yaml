  - Do not import legacy agents or skills by default.
  - Review each Profile and Skill before adding it to Core.
  - Prefer a project/domain extension over Core when reuse is not proven.
  - Specialize through Skills and Knowledge before creating additional Profiles.
  - Treat the four current Profiles as the default Core responsibility set until a demonstrated gap requires another.
  - Add Core Skills only when a repeated procedure is demonstrated across real flows.

