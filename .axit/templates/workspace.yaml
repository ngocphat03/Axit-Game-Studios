spec_version: axit.workspace/v1

workspace:
  id: ""
  name: ""
  summary: ""

source:
  root: src

axit:
  core: .axit/core/core.yaml
  architecture_registry: .axit/registry/architecture.yaml
  integration_registry: .axit/registry/integrations.yaml
  active_state: .axit/state/active.md
  project_memory: .axit/memory/project-memory.md
  decision_log: .axit/memory/decision-log.md
  milestone_map: .axit/roadmap/milestones-mockup.md

safety:
  check_git_status: false

systems: []

workspace_extensions:
  profiles: []
  skills: []
  workflows: []
  knowledge: []

validation:
  contract_tests: tests/contracts
  integration_tests: tests/integration
  end_to_end_tests: tests/e2e

notes:
  - "Keep this manifest compact; it routes repository-level context and system boundaries."
  - "Use memory for durable alignment, active_state for current execution, and milestone_map as a non-executable roadmap alignment artifact."
  - "Git status checking is opt-in; set safety.check_git_status to true only when the workspace wants clean-worktree/status validation."
  - "Register Systems only when their source roots/boundaries are known."
  - "Do not duplicate executable cross-system contracts into `.axit`."
