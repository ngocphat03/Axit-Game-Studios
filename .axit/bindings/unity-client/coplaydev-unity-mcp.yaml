spec_version: axit.runtime-binding/v1
id: coplaydev-unity-mcp
system: unity-client
status: active

transport:
  family: mcp
  server: unityMCP
  adapter: CoplayDev unity-mcp
  adapter_package: com.coplaydev.unity-mcp
  resource_scheme: mcpforunity

runtime_boundary:
  availability: resolve-at-runtime
  authorization: runtime-harness-policy
  binding_grants_permission: false
  committed_connection_state: false
  source_writes_permitted: false

normalization:
  tool_response_source_priority:
    - structuredContent
    - content[0].text parsed only when structuredContent is absent
  tool_operation_success_path: structuredContent.success
  resource_payload_path: contents[0].text parsed as JSON
  outer_isError_is_sufficient: false
  outcomes:
    acquired: trustworthy observation of the requested target or scope
    unavailable: required binding, editor, runtime state, or dependency is unavailable
    denied: runtime or Harness policy refused the operation
    transport_error: transport failed before a trustworthy target observation
  trustworthy_observed_absence_or_failure: Preserve as acquired evidence for verify-change; do not translate it directly into a product verdict.
  verdict_boundary: Acquisition outcomes and observed values are evidence, never PASS, FAIL, or BLOCKED by themselves.
  ephemeral_evidence_fields:
    - componentInstanceId
    - targetInstanceId
    - ownerInstanceId

mappings:
  - capability: unity.prefab.inspect
    operation_class: inspect
    side_effects: read-only
    inputs:
      prefab_path:
        type: unity-project-asset-path
        required: true
        constraints:
          - exact caller-supplied project-relative path under Assets/
          - prefab asset path only
    operations:
      - manage_prefabs
      - manage_prefabs
    operation_templates:
      - id: prefab-info
        operation: manage_prefabs
        arguments:
          action: get_info
          prefab_path: "{{prefab_path}}"
        success_path: structuredContent.success
        result_path: structuredContent.data
        observed_result_fields:
          - assetPath
          - guid
          - prefabType
          - rootObjectName
          - rootComponentTypes
          - childCount
          - isVariant
          - parentPrefab
      - id: prefab-hierarchy
        operation: manage_prefabs
        arguments:
          action: get_hierarchy
          prefab_path: "{{prefab_path}}"
        success_path: structuredContent.success
        result_path: structuredContent.data
        observed_result_fields:
          - prefabPath
          - total
          - items
    execution:
      order:
        - prefab-info
        - prefab-hierarchy
      target_resolution: The acquisition request must supply the exact prefab path; target search is outside this mapping.
    evidence_boundary:
      can_establish:
        - component presence and serialized values/references on the inspected prefab
        - prefab hierarchy facts relevant to the accepted criterion
      cannot_establish:
        - runtime-instantiated behavior
        - scene overrides not inspected
        - behavior produced only by runtime code

  - capability: unity.serialized-fields.inspect
    operation_class: inspect
    side_effects: read-only
    inputs:
      prefab_path:
        type: unity-project-asset-path
        required: true
        render_as: complete escaped C# string literal
        constraints:
          - exact caller-supplied project-relative path under Assets/
          - prefab asset path only
      component_type:
        type: fully-qualified-csharp-type-name
        required: true
        render_as: complete escaped C# string literal
        constraints:
          - exact loaded component FullName
    operations:
      - execute_code
    operation_templates:
      - id: inspect-serialized-fields
        operation: execute_code
        arguments:
          action: execute
          compiler: codedom
          safety_checks: true
          code_template: |
            var prefabPath = {{prefab_path}};
            var root = UnityEditor.AssetDatabase.LoadAssetAtPath<UnityEngine.GameObject>(prefabPath);
            if (root == null)
            {
                return new System.Collections.Generic.Dictionary<string, object>
                {
                    { "error", "prefab_not_found" },
                    { "prefabPath", prefabPath }
                };
            }

            var result = new System.Collections.Generic.List<System.Collections.Generic.Dictionary<string, object>>();
            var components = root.GetComponentsInChildren<UnityEngine.Component>(true);
            foreach (var component in components)
            {
                if (component == null || component.GetType().FullName != {{component_type}})
                {
                    continue;
                }

                var names = new System.Collections.Generic.List<string>();
                var cursor = component.transform;
                while (cursor != null)
                {
                    names.Add(cursor.name);
                    if (cursor == root.transform)
                    {
                        break;
                    }
                    cursor = cursor.parent;
                }
                names.Reverse();

                var entry = new System.Collections.Generic.Dictionary<string, object>();
                entry["prefabPath"] = prefabPath;
                entry["gameObjectPath"] = string.Join("/", names.ToArray());
                entry["componentType"] = component.GetType().FullName;
                entry["componentInstanceId"] = component.GetInstanceID();

                var fields = new System.Collections.Generic.List<System.Collections.Generic.Dictionary<string, object>>();
                var serializedObject = new UnityEditor.SerializedObject(component);
                var property = serializedObject.GetIterator();
                var enterChildren = true;
                while (property.NextVisible(enterChildren))
                {
                    enterChildren = false;
                    var field = new System.Collections.Generic.Dictionary<string, object>();
                    field["propertyPath"] = property.propertyPath;
                    field["propertyType"] = property.propertyType.ToString();

                    if (property.propertyType == UnityEditor.SerializedPropertyType.Integer)
                    {
                        field["value"] = property.longValue;
                    }
                    else if (property.propertyType == UnityEditor.SerializedPropertyType.Boolean)
                    {
                        field["value"] = property.boolValue;
                    }
                    else if (property.propertyType == UnityEditor.SerializedPropertyType.Float)
                    {
                        field["value"] = property.doubleValue;
                    }
                    else if (property.propertyType == UnityEditor.SerializedPropertyType.String)
                    {
                        field["value"] = property.stringValue;
                    }
                    else if (property.propertyType == UnityEditor.SerializedPropertyType.Enum)
                    {
                        field["value"] = property.enumValueIndex;
                        field["enumName"] = property.enumDisplayNames.Length > property.enumValueIndex
                            ? property.enumDisplayNames[property.enumValueIndex]
                            : null;
                    }
                    else if (property.propertyType == UnityEditor.SerializedPropertyType.ObjectReference)
                    {
                        var referenced = property.objectReferenceValue;
                        if (referenced == null)
                        {
                            field["value"] = null;
                        }
                        else
                        {
                            var reference = new System.Collections.Generic.Dictionary<string, object>();
                            reference["name"] = referenced.name;
                            reference["type"] = referenced.GetType().FullName;
                            reference["instanceId"] = referenced.GetInstanceID();
                            var assetPath = UnityEditor.AssetDatabase.GetAssetPath(referenced);
                            reference["assetPath"] = assetPath;
                            reference["assetGuid"] = string.IsNullOrEmpty(assetPath)
                                ? null
                                : UnityEditor.AssetDatabase.AssetPathToGUID(assetPath);
                            field["value"] = reference;
                        }
                    }
                    else
                    {
                        field["value"] = property.propertyType.ToString();
                    }

                    fields.Add(field);
                }

                entry["fields"] = fields;
                result.Add(entry);
            }

            return result;
        success_path: structuredContent.success
        compiler_path: structuredContent.data.compiler
        result_path: structuredContent.data.result
    template_boundary:
      caller_supplied_code: forbidden
      substitutions:
        - prefab_path as a validated, escaped C# string literal
        - component_type as a validated, escaped C# string literal
      forbidden_apis_and_behaviors:
        - serialized property assignment
        - ApplyModifiedProperties
        - asset, prefab, or scene save/import operations
        - prefab-stage or scene mutation
        - file, process, or network operations
        - arbitrary caller code
      observed_coverage: Top-level visible integer, boolean, float, string, enum, and object-reference properties only.
    evidence_boundary:
      can_establish:
        - current serialized scalar/value/reference state on the inspected target
        - missing or mismatched serialized references that are directly observable
      cannot_establish:
        - runtime-mutated values after execution begins
        - behavior implied by a value but not actually exercised

  - capability: unity.playmode.verify
    operation_class: execute
    side_effects: controlled-runtime
    inputs:
      scenario_label:
        type: string
        required: true
        render_as: complete escaped C# string literal
      target_hierarchy_path:
        type: unity-hierarchy-path
        required: true
        render_as: complete escaped C# string literal
      base_damage:
        type: int32
        required: true
        render_as: C# integer literal
        constraints:
          minimum: 0
    operations:
      - resources/read
      - manage_editor
      - resources/read
      - execute_code
      - execute_code
      - manage_editor
      - resources/read
    operation_templates:
      - id: read-pre-state
        operation: resources/read
        server: unityMCP
        arguments:
          uri: mcpforunity://editor/state
        result_path: contents[0].text
      - id: enter-play-mode
        operation: manage_editor
        arguments:
          action: play
        success_path: structuredContent.success
      - id: poll-play-mode-ready
        operation: resources/read
        server: unityMCP
        arguments:
          uri: mcpforunity://editor/state
        completion_condition:
          - data.editor.play_mode.is_playing == true
          - data.advice.ready_for_tools == true
        polling: bounded by the acquisition request or Runtime/Harness; unbounded sleep is forbidden
      - id: prepare-gameplay-state
        operation: execute_code
        arguments:
          action: execute
          compiler: codedom
          safety_checks: true
          code_template: |
            var result = new System.Collections.Generic.Dictionary<string, object>();
            result["applicationIsPlaying"] = UnityEngine.Application.isPlaying;
            result["stateMachineAvailable"] = QG.GameStateMachine.GameStateMachine.Instance != null;
            if (!UnityEngine.Application.isPlaying)
            {
                result["requested"] = false;
                result["reason"] = "not_in_play_mode";
                return result;
            }
            if (QG.GameStateMachine.GameStateMachine.Instance == null)
            {
                result["requested"] = false;
                result["reason"] = "state_machine_unavailable";
                return result;
            }
            QG.GameStateMachine.GameStateMachine.Instance.TransitionTo<
                QG.GameStateMachine.GamePlayState,
                QG.GameStateMachine.GamePlayStateModel>(
                    new QG.GameStateMachine.GamePlayStateModel());
            result["requested"] = true;
            return result;
        success_path: structuredContent.success
        compiler_path: structuredContent.data.compiler
        result_path: structuredContent.data.result
        completion_condition:
          - structuredContent.data.result.applicationIsPlaying == true
          - structuredContent.data.result.requested == true
        on_incomplete: Do not run the headshot template; preserve reason as evidence and continue to mandatory cleanup.
      - id: run-bounded-headshot
        operation: execute_code
        arguments:
          action: execute
          compiler: codedom
          safety_checks: true
          code_template: |
            var result = new System.Collections.Generic.Dictionary<string, object>();
            result["applicationIsPlaying"] = UnityEngine.Application.isPlaying;
            result["scenario"] = {{scenario_label}};
            result["requestedTargetPath"] = {{target_hierarchy_path}};
            result["baseDamage"] = {{base_damage}};

            if (!UnityEngine.Application.isPlaying)
            {
                result["completed"] = false;
                result["reason"] = "not_in_play_mode";
                return result;
            }

            QG.Entity.DamageableBodyPart target = null;
            var parts = UnityEngine.Object.FindObjectsByType<QG.Entity.DamageableBodyPart>(
                UnityEngine.FindObjectsInactive.Include,
                UnityEngine.FindObjectsSortMode.None);
            foreach (var part in parts)
            {
                var names = new System.Collections.Generic.List<string>();
                var cursor = part.transform;
                while (cursor != null)
                {
                    names.Add(cursor.name);
                    cursor = cursor.parent;
                }
                names.Reverse();
                var path = string.Join("/", names.ToArray());
                if (path == {{target_hierarchy_path}})
                {
                    target = part;
                    result["observedTargetPath"] = path;
                    break;
                }
            }

            if (target == null)
            {
                result["completed"] = false;
                result["reason"] = "target_not_found";
                return result;
            }
            if (target.OwnerEntity == null || target.OwnerEntity.Model == null)
            {
                result["completed"] = false;
                result["reason"] = "target_owner_uninitialized";
                return result;
            }

            var beforeHealth = target.OwnerEntity.Model.Health;
            var multiplier = target.DamageMultiplier;
            var armor = target.OwnerEntity.Armor;
            var expectedHitZoneDamage = QG.Combat.DamageCalculator.Calculate({{base_damage}}, multiplier);
            var expectedFinalDamage = QG.Combat.DamageCalculator.ApplyArmor(expectedHitZoneDamage, armor);

            result["targetInstanceId"] = target.GetInstanceID();
            result["ownerName"] = target.OwnerEntity.name;
            result["ownerType"] = target.OwnerEntity.GetType().FullName;
            result["ownerInstanceId"] = target.OwnerEntity.GetInstanceID();
            result["damageMultiplier"] = multiplier;
            result["armor"] = armor;
            result["beforeHealth"] = beforeHealth;
            result["expectedHitZoneDamage"] = expectedHitZoneDamage;
            result["expectedFinalDamage"] = expectedFinalDamage;

            try
            {
                target.TakeDamage({{base_damage}});
                result["callReturned"] = true;
            }
            catch (System.Exception exception)
            {
                result["callReturned"] = false;
                result["exceptionType"] = exception.GetType().FullName;
                result["exceptionMessage"] = exception.Message;
            }

            var afterHealth = target.OwnerEntity.Model.Health;
            result["afterHealth"] = afterHealth;
            result["observedDamage"] = beforeHealth - afterHealth;
            result["completed"] = true;
            return result;
        success_path: structuredContent.success
        compiler_path: structuredContent.data.compiler
        result_path: structuredContent.data.result
        readiness_retry:
          retry_only_when_reason:
            - target_not_found
            - target_owner_uninitialized
          polling: bounded by the acquisition request or Runtime/Harness; unbounded sleep is forbidden
      - id: stop-play-mode
        operation: manage_editor
        arguments:
          action: stop
        success_path: structuredContent.success
      - id: confirm-play-mode-stopped
        operation: resources/read
        server: unityMCP
        arguments:
          uri: mcpforunity://editor/state
        completion_condition:
          - data.editor.play_mode.is_playing == false
        polling: bounded by the acquisition request or Runtime/Harness; unbounded sleep is forbidden
    execution:
      precondition:
        - read and retain Play Mode pre-state
        - if Play Mode is already active, do not mutate or stop that session; report unavailable unless Runtime/Harness supplies another reviewed restoration policy
      try:
        - enter-play-mode
        - poll-play-mode-ready
        - prepare-gameplay-state
        - run-bounded-headshot
      finally:
        condition: this acquisition entered Play Mode
        mandatory:
          - stop-play-mode
          - confirm-play-mode-stopped
      operation_completed_when:
        - structuredContent.success == true
        - structuredContent.data.compiler == "codedom"
        - structuredContent.data.result.completed == true
        - structuredContent.data.result.callReturned == true
      completion_is_not_verdict: true
    template_boundary:
      caller_supplied_code: forbidden
      substitutions:
        - scenario_label as a validated, escaped C# string literal
        - target_hierarchy_path as a validated, escaped C# string literal
        - base_damage as a validated C# int32 literal
      allowed_runtime_mutation:
        - transition the current runtime-only state machine to GamePlayState
        - call DamageableBodyPart.TakeDamage(base_damage) on the exact runtime target
      forbidden_apis_and_behaviors:
        - asset, prefab, scene, project, or source writes
        - editor save/import operations
        - file, process, or network operations
        - arbitrary caller code
      lifecycle: Runtime mutation is ephemeral and must be discarded by the mandatory Play Mode stop cleanup.
      diagnostics_boundary: expectedHitZoneDamage and expectedFinalDamage are production-code diagnostics, not an independent oracle.
    evidence_boundary:
      can_establish:
        - runtime behavior directly exercised and observed during the bounded Play Mode scenario
        - runtime state/log outcomes explicitly captured by the scenario
      cannot_establish:
        - unrelated gameplay paths not exercised by the scenario
        - broad game correctness from one scenario
        - deterministic source/serialization facts that were not observed

  - capability: unity.compile
    operation_class: execute
    side_effects: derived-artifacts
    inputs:
      exact_runtime_target:
        type: current-unity-editor-project-identity
        required: true
        constraints:
          - exact unity-client System and QuickGun-MVP project identity
          - current project root and connected editor identity must be resolved from live resources; partial-name matching is forbidden
          - resolved identity is acquisition-scoped and must not be persisted in this binding
      identity_timeout:
        type: bounded-duration
        required: true
        constraints:
          - positive and bounded by the acquisition request or Runtime/Harness
      compilation_timeout:
        type: bounded-duration
        required: true
        constraints:
          - positive and bounded by the acquisition request or Runtime/Harness
      diagnostics_timeout:
        type: bounded-duration
        required: true
        constraints:
          - positive and bounded by the acquisition request or Runtime/Harness
    operations:
      - resources/read
      - read_console
      - refresh_unity
    operation_templates:
      - id: resolve-pre-editor-identity
        operation: resources/read
        server: unityMCP
        arguments:
          uri: mcpforunity://instances
        result_path: contents[0].text
      - id: read-pre-project-identity
        operation: resources/read
        server: unityMCP
        arguments:
          uri: mcpforunity://project/info
        result_path: contents[0].text
        payload_success_path: success
        payload_result_path: data
        observed_result_fields:
          - projectName
          - projectRoot
          - unityVersion
      - id: read-pre-editor-state
        operation: resources/read
        server: unityMCP
        arguments:
          uri: mcpforunity://editor/state
        result_path: contents[0].text
        payload_success_path: success
        payload_result_path: data
      - id: clear-compile-diagnostic-window
        operation: read_console
        arguments:
          action: clear
        outer_error_path: isError
        success_path: structuredContent.success
        message_path: structuredContent.message
        result_path: structuredContent.data
        mutation_boundary: Ephemeral Unity Console clear only; this is not a source, asset, scene, or project write.
      - id: request-script-compilation
        operation: refresh_unity
        arguments:
          mode: force
          scope: scripts
          compile: request
          wait_for_ready: false
        outer_error_path: isError
        success_path: structuredContent.result.success
        message_path: structuredContent.result.message
        error_path: structuredContent.result.error
        result_path: structuredContent.result.data
        observed_result_fields:
          - refresh_triggered
          - compile_requested
          - resulting_state
          - hint
        request_accepted_when:
          - isError != true
          - structuredContent.result.success == true
          - structuredContent.result.data.compile_requested == true
        request_acceptance_is_not_compile_success: true
      - id: poll-fresh-compile-cycle-to-terminal
        operation: resources/read
        server: unityMCP
        arguments:
          uri: mcpforunity://editor/state
        result_path: contents[0].text
        payload_success_path: success
        payload_result_path: data
        correlation:
          pre_request_snapshot:
            - retain the successful read-pre-editor-state payload for exact_runtime_target before requesting compilation
            - retain available compile start, compile finish, and domain-reload marker values only for comparisons within this acquisition
          order:
            - after request-script-compilation is accepted, establish fresh_cycle_correlated through any one accepted alternative
            - after fresh_cycle_correlated, separately establish terminal_state_observed from a successful editor-state payload
          fresh_cycle_correlated:
            require_any:
              - id: post-request-nonterminal-state
                source: successful post-request editor-state payload
                condition_any:
                  - data.compilation.is_compiling == true
                  - data.compilation.is_domain_reload_pending == true
                  - data.assets.is_updating == true
                  - data.advice.ready_for_tools == false
              - id: post-request-compile-marker-advanced
                source: successful post-request editor-state payload for the same exact target as the retained pre-request snapshot
                marker_condition_any:
                  - data.compilation.last_compile_started_unix_ms is present and greater than its retained pre-request value
                  - data.compilation.last_compile_finished_unix_ms is present and greater than its retained pre-request value
              - id: post-request-domain-reload-marker-advanced
                source: successful post-request editor-state payload for the same exact target as the retained pre-request snapshot
                marker_condition:
                  - data.compilation.last_domain_reload_after_unix_ms is present and greater than its retained pre-request value
            insufficient:
              - request acceptance alone
              - a transient resource not-ready response alone; it counts only when followed by an accepted fresh-cycle marker and then terminal_state_observed
          terminal_state_observed:
            require_separate_observation_after: fresh_cycle_correlated
            condition_all:
              - data.compilation.is_compiling == false
              - data.compilation.is_domain_reload_pending == false
              - data.assets.is_updating == false
              - data.advice.ready_for_tools == true
          comparison_boundary:
            exact_target: Pre-request values and every post-request comparison must belong to the same exact project/editor target.
            session_continuity: An expected domain reload may change the ephemeral session id; session-id equality across reload is not required.
            persistence: Session ids, editor instance hashes, and marker timestamps are acquisition-local evidence and must not be persisted.
          reload_boundary: Unity 6 may finish a fast compile cycle before any nonterminal boolean state is sampled; an advanced accepted compile or domain-reload marker can establish fresh_cycle_correlated, but terminal_state_observed is still required separately.
        polling: bounded by compilation_timeout; unbounded sleep is forbidden
      - id: resolve-post-reload-editor-identity
        operation: resources/read
        server: unityMCP
        arguments:
          uri: mcpforunity://instances
        result_path: contents[0].text
      - id: read-post-reload-project-identity
        operation: resources/read
        server: unityMCP
        arguments:
          uri: mcpforunity://project/info
        result_path: contents[0].text
        payload_success_path: success
        payload_result_path: data
        observed_result_fields:
          - projectName
          - projectRoot
          - unityVersion
      - id: read-fresh-compile-diagnostics
        operation: read_console
        arguments:
          action: get
          types:
            - error
            - warning
          page_size: 500
          cursor: 0
          format: detailed
          include_stacktrace: true
        outer_error_path: isError
        success_path: structuredContent.success
        message_path: structuredContent.message
        result_path: structuredContent.data
        observed_result_fields:
          - cursor
          - pageSize
          - nextCursor
          - truncated
          - total
          - items
        diagnostic_item_fields:
          - type
          - message
          - file
          - line
          - stackTrace
        pagination:
          next_cursor_path: structuredContent.data.nextCursor
          next_request_cursor: previous structuredContent.data.nextCursor
          complete_when: structuredContent.data.nextCursor == null
          polling: bounded by diagnostics_timeout; repeated cursors and unbounded paging are forbidden
    execution:
      precondition:
        - resolve-pre-editor-identity
        - read-pre-project-identity
        - read-pre-editor-state
        - require exact current QuickGun-MVP project root and connected editor agreement before mutation
      order:
        - clear-compile-diagnostic-window
        - request-script-compilation
        - poll-fresh-compile-cycle-to-terminal
        - resolve-post-reload-editor-identity
        - read-post-reload-project-identity
        - read-fresh-compile-diagnostics
      identity_boundary:
        - re-resolve the current editor and project after reload before accepting terminal evidence or diagnostics
        - pre-request and post-reload identity must both exactly match exact_runtime_target
        - do not retain live editor identifiers, connection details, or other acquisition-local identity as canonical binding data
      timeout_boundary:
        identity_resolution: bounded by identity_timeout
        compile_cycle: bounded by compilation_timeout
        diagnostic_paging: bounded by diagnostics_timeout
        unbounded_waits: forbidden
      acquired_when:
        common:
          - exact identity is established before the request and again after reload
          - console clear succeeds before the compilation request
          - compilation request is accepted
          - fresh_cycle_correlated is established after request acceptance through any one accepted correlation alternative
          - terminal_state_observed is separately established after fresh_cycle_correlated
          - every error/warning diagnostics page is acquired through nextCursor == null
        no_fresh_errors: common conditions hold and no returned diagnostic item is classified as an error
        fresh_errors: common conditions hold and one or more returned diagnostic items are classified as errors
      outcome_boundary:
        acquired: Return either acquired with no fresh errors or acquired with fresh errors; compiler errors remain trustworthy acquired evidence.
        unavailable: Required binding, exact QuickGun editor/project identity, or compatible runtime dependency is unavailable.
        denied: Runtime or Harness policy refuses any required operation, including the ephemeral Console clear or compilation request.
        transport_error: The transport or composite operation fails before the complete identity-correlated compile observation and diagnostic page set is trustworthy.
      completion_is_not_verdict: true
    side_effect_boundary:
      allowed:
        - Unity script-compilation derived artifacts
        - ephemeral Unity Console clear used only to establish the fresh diagnostic window
      forbidden:
        - source, asset, prefab, scene, project-setting, package, or connection-configuration writes
        - Play Mode entry or gameplay mutation
    suboperation_boundary: Identity resources and Console diagnostics are internal to unity.compile acquisition and do not map unity.project.inspect or unity.console.inspect.
    evidence_boundary:
      can_establish:
        - whether the exact current QuickGun-MVP project scripts complete the observed fresh Unity compilation cycle without fresh compiler errors
        - concrete fresh compiler errors and warnings returned from the complete bounded diagnostic window
      cannot_establish:
        - gameplay correctness or Play Mode behavior
        - correctness outside the exact project/editor and acquisition window observed
        - compilation success from refresh_unity request acceptance alone

unbound_capabilities:
  - unity.project.inspect
  - unity.tests.run
  - unity.scene.inspect
  - unity.component.inspect
  - unity.console.inspect

notes:
  - This active binding records reviewed operation contracts, not current connectivity.
  - The active mappings are exactly unity.prefab.inspect, unity.serialized-fields.inspect, unity.playmode.verify, and unity.compile.
  - unity.compile identity-resource reads and Console diagnostic suboperations are internal to compile acquisition; they do not map unity.project.inspect or unity.console.inspect.
  - unity.project.inspect, unity.tests.run, unity.scene.inspect, unity.component.inspect, and unity.console.inspect remain explicitly unbound.
  - Runtime/Harness policy owns authorization and verify-change owns evidence classification and verdicts.
