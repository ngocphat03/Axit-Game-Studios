spec_version: axit.system-capabilities/v1
system: unity-client

capability_sets:
  - .axit/capabilities/unity/evidence.yaml

binding_status: active

runtime_bindings:
  - .axit/bindings/unity-client/coplaydev-unity-mcp.yaml

unbound_capabilities:
  - unity.project.inspect
  - unity.compile
  - unity.tests.run
