spec_version: axit.system/v1

system:
  id: unity-client
  name: QuickGun-MVP
  kind: game-client
  source: src/QuickGun-MVP
  stage: prototype

source_repository:
  kind: git
  repository: ngocphat03/QuickGun-MVP
  canonical_ref: release
  notes:
    - "Resolve the current commit/ref at evidence time; do not persist a moving branch head as timeless truth."
    - "The System repository may be nested, a submodule, separately tracked, or otherwise independent from the root Workspace repository."

runtime:
  engine: Unity
  version: ""
  language: C#

context:
  rules: .axit/systems/unity-client/rules.md
  architecture: .axit/systems/unity-client/architecture.yaml
  knowledge: []

interfaces:
  provides: []
  consumes: []

validation:
  static_checks:
    - git diff --check
  automated_tests:
    - "standalone deterministic C# tests under tests/QuickGun-MVP/"
  runtime_checks:
    - "Unity compile/build when the local Unity environment is complete"

extensions:
  profiles: []
  skills: []
  workflows: []

unconfirmed:
  - exact Unity version
  - target platforms
  - player-count range

notes:
  - "This system uses the shared root Axit Core; do not duplicate Core under the source directory."
  - "Keep system-specific context here and cross-system contracts in the root registries."
  - "Git provenance is System-aware: evidence may be canonical in this System repository even when the root Workspace repository does not track the System tree."
